<script src="/assets/js/liturgie-common.js"></script>

<article class="box post">
    <header class="style1">
        <h2 id="liturgie-title">Kerkdienst</h2>
        <p id="liturgie-details" style="margin: 0.5em 0; font-size: 0.95em;"></p>
        <p id="liturgie-predikant" style="margin-top: 0.5em;"></p>
    </header>

    <!-- Live Section -->
    <section id="live-section" style="margin-top: 2em; display: none;">
        <h3>Live Kerkdienst</h3>
        <p>Bekijk de live uitzending van de kerkdienst op ons YouTube kanaal:</p>
        <p style="text-align: center; margin: 2em 0;">
            <a id="live-button" href="" target="_blank" class="button style1">
                Open Live Stream op YouTube
            </a>
        </p>
        <p><em>De live stream opent in een nieuw venster wanneer de uitzending actief is.</em></p>
    </section>

    <!-- YouTube Frame -->
    <iframe id="youtube-frame" width="100%" height="450" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="max-width: 100%; border-radius: 8px; display: none;"></iframe>

    <!-- PDF Section -->
    <section id="pdf-section" style="margin-top: 2em; display: none;">
        <h3></h3>
        <iframe id="pdf-frame" src="" width="100%" height="600px" style="border: 1px solid #ddd; border-radius: 8px;"></iframe>
    </section>
</article>

<script>
    // Format and display liturgie details
    function populateLiturgieDetails() {
        var url = new URL(window.location.href);
        var date = url.searchParams.get('date');
        var time = url.searchParams.get('time') || '';
        var location = url.searchParams.get('location') || '';
        var preacher = url.searchParams.get('preacher') || '';
        
        if (date) {
            // Format date for display
            var months = {
                'jan': 'Januari', 'feb': 'Februari', 'mar': 'Maart', 'apr': 'April',
                'may': 'Mei', 'jun': 'Juni', 'jul': 'Juli', 'aug': 'Augustus',
                'sep': 'September', 'oct': 'Oktober', 'nov': 'November', 'dec': 'December'
            };
            var monthNumbers = {
                'jan': 0, 'feb': 1, 'mar': 2, 'apr': 3,
                'may': 4, 'jun': 5, 'jul': 6, 'aug': 7,
                'sep': 8, 'oct': 9, 'nov': 10, 'dec': 11
            };
            var weekdayNames = ['Zondag', 'Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag'];
            var match = date.match(/^(\d+)([a-z]+)(\d+)$/);
            var formattedDate = date;
            if (match) {
                var day = parseInt(match[1], 10);
                var monthKey = match[2].toLowerCase();
                var year = parseInt(match[3], 10);
                var monthName = months[monthKey];
                var monthIndex = monthNumbers[monthKey];
                if (!isNaN(day) && !isNaN(year) && monthName !== undefined && monthIndex !== undefined) {
                    var dateObj = new Date(year, monthIndex, day);
                    formattedDate = weekdayNames[dateObj.getDay()] + ' ' + day + ' ' + monthName;
                }
            }
            
            // Update title
            var titleText = formattedDate;
            if (time) {
                var normalizedTime = time.replace(/\s*uur\s*$/i, '').trim();
                titleText += ' ' + normalizedTime + ' uur';
            }
            var titleEl = document.getElementById('liturgie-title');
            if (titleEl) titleEl.textContent = titleText;
            
            // Update details
            var detailsEl = document.getElementById('liturgie-details');
            if (detailsEl) detailsEl.textContent = location;
            
            // Update preacher
            var preacherEl = document.getElementById('liturgie-predikant');
            if (preacherEl) preacherEl.textContent = preacher || '';
        }
    }
    
    // Execute immediately and also on DOMContentLoaded
    populateLiturgieDetails();
    document.addEventListener('DOMContentLoaded', populateLiturgieDetails);
</script>
